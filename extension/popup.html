<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><link rel="stylesheet" href="ui.css"></head><body><main>
<h1>SAT2 Relay Bridge 2.2</h1>
<div class="card"><div class="row"><label><input id="auto" type="checkbox"> 自动推进</label><button id="run" class="primary">立即轮询与投递</button><button id="submitDecision">提交当前 Decision</button></div><div id="status" class="status muted">未连接</div><div id="queue" class="muted"></div></div>
<div class="card"><strong>绑定当前 ChatGPT Session</strong><div class="row"><select id="role"><option>mentor</option><option>S1</option><option>S2</option><option>S3</option><option>S4</option></select><button id="bind">绑定当前页</button><button id="unbind">解除</button></div><div id="bindings"></div></div>
<div class="card"><strong>诊断</strong><div class="row"><button id="doctor">深度自检</button><button id="bundle">诊断包</button><button id="reload">重载凭据</button><button id="dashboard">Control Center</button></div><pre id="diagnostic" class="mini"></pre></div>
<div class="card"><strong>手动投递测试</strong><div class="row"><select id="manualRole"><option>mentor</option><option>S1</option><option>S2</option><option>S3</option><option>S4</option></select></div><textarea id="manualText">SAT2 Relay browser delivery test. Reply only with: RELAY_TEST_OK</textarea><button id="manual">发送测试</button></div>
<div class="row"><button id="options">连接设置</button></div>
<script type="module" src="popup.js"></script></main></body></html>
