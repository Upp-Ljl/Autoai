<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><link rel="stylesheet" href="ui.css"><title>SAT2 Relay 设置</title></head><body><main style="max-width:760px;margin:auto">
<h1>SAT2 Relay Bridge 2.0 设置</h1><div class="card"><label>Control Center 地址</label><input id="url" style="width:100%;box-sizing:border-box" value="http://127.0.0.1:8765"><label>本地 API token</label><input id="token" type="password" style="width:100%;box-sizing:border-box"><div class="row"><label><input id="activate" type="checkbox"> 投递时激活标签页</label><label><input id="open" type="checkbox"> 标签页缺失时重新打开</label><label><input id="duplicates" type="checkbox"> 开发模式：允许角色重复绑定</label></div><label>GitHub Connector 模式</label><select id="connector"><option value="session_verified">Session 已验证（推荐，稳定）</option><option value="best_effort_attach">尽力附加 @GitHub</option><option value="strict_attach">必须确认 @GitHub 附加</option></select><div class="row"><button id="test">测试连接</button><button id="doctor">深度自检</button><button id="save" class="primary">保存</button></div><pre id="result" class="status muted"></pre></div>
<p class="muted">GitHub PAT 不存放在扩展中。使用 <code>sat2-relay credentials set --github-token</code> 写入本地凭据仓库；Windows 使用当前用户 DPAPI。</p>
<script type="module" src="options.js"></script></main></body></html>
