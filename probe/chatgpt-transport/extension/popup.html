<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
  body { width: 320px; font-family: system-ui, sans-serif; font-size: 13px; margin: 0; padding: 12px; }
  h1 { font-size: 14px; margin: 0 0 8px; }
  .row { margin: 6px 0; display: flex; gap: 6px; flex-wrap: wrap; }
  button { padding: 6px 8px; border: 1px solid #ccc; border-radius: 6px; background: #f6f8fa; cursor: pointer; }
  button:disabled { opacity: 0.5; }
  .status { margin-top: 8px; white-space: pre-wrap; color: #444; }
  .ok { color: #08764f; }
  .bad { color: #b42318; }
</style>
</head>
<body>
<h1>SAT2 Transport Probe (Phase 2)</h1>
<div class="row">
  <button id="attach">附着当前标签页</button>
  <button id="attachAll">附着所有 ChatGPT 标签页</button>
  <button id="detach" disabled>停止</button>
</div>
<div class="row">
  <button id="markA" disabled>标记 A</button>
  <button id="markB" disabled>标记 B</button>
  <button id="markG" disabled>标记 GITHUB</button>
  <button id="markConcurrent" disabled>标记并发实验</button>
</div>
<div class="row">
  <button id="export" disabled>停止并导出 JSONL</button>
  <button id="clear" disabled>清空记录</button>
</div>
<div id="status" class="status">未附着。</div>
<div id="count" class="status"></div>
<script src="popup.js"></script>
</body>
</html>
