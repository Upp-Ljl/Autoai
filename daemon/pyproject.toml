[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sat2-relay"
version = "2.2.2"
description = "Local fail-closed control plane for SAT2 ChatGPT Mentor/Worker relay"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.128.2",
  "uvicorn==0.48.0",
  "httpx==0.28.1",
  "PyYAML==6.0.3",
  "jsonschema==4.26.0",
  "pydantic==2.13.4",
]

[project.optional-dependencies]
test = ["pytest==9.0.2"]

[project.scripts]
sat2-relay = "sat2_relay.cli:main"
sat2-relay-mcp = "sat2_relay.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]

[tool.setuptools.package-data]
sat2_relay = ["relay-event-v2.schema.json"]
